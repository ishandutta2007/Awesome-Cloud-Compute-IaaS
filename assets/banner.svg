<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #38bdf8; font-weight: 700; letter-spacing: 0.5px; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #e2e8f0; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>

  <!-- Background Grid -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <path d="M 0 40 L 1200 40 M 0 80 L 1200 80 M 0 120 L 1200 120 M 0 160 L 1200 160 M 0 200 L 1200 200 M 0 240 L 1200 240 M 0 280 L 1200 280" />
    <path d="M 100 0 L 100 320 M 200 0 L 200 320 M 300 0 L 300 320 M 400 0 L 400 320 M 500 0 L 500 320 M 600 0 L 600 320 M 700 0 L 700 320 M 800 0 L 800 320 M 900 0 L 900 320 M 1000 0 L 1000 320 M 1100 0 L 1100 320" />
  </g>

  <!-- Background Wave Lines -->
  <path d="M -50 220 Q 300 120 600 220 T 1250 180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <path d="M -50 180 Q 300 280 600 160 T 1250 240" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.25"/>

  <!-- Background Graphic Elements -->
  <g opacity="0.4">
    <rect x="850" y="40" width="280" height="100" rx="12" fill="url(#card-glow)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="880" cy="75" r="6" fill="#38bdf8"/>
    <rect x="900" y="70" width="180" height="10" rx="5" fill="#334155"/>
    <rect x="900" y="90" width="120" height="8" rx="4" fill="#1e293b"/>
  </g>

  <g opacity="0.4">
    <rect x="890" y="170" width="260" height="110" rx="12" fill="url(#card-glow)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="920" cy="205" r="6" fill="#818cf8"/>
    <rect x="940" y="200" width="150" height="10" rx="5" fill="#334155"/>
    <rect x="940" y="220" width="100" height="8" rx="4" fill="#1e293b"/>
  </g>

  <!-- Foreground Content Block -->
  <g transform="translate(60, 0)">
    <!-- Tag/Category Pill -->
    <g transform="translate(0, 50)">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="125" y="21" text-anchor="middle" class="badge-text">CURATED IAAS &amp; COMPUTE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title">
      Awesome Cloud Compute <tspan fill="url(#accent)">IaaS</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">
      Virtual Machines • Bare Metal • Open-Source Orchestration • GPU Instances
    </text>

    <!-- Tech Stack / Pill Badges -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="120" height="30" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="60" y="20" text-anchor="middle" class="pill-text">OpenStack</text>
      
      <!-- Pill 2 -->
      <rect x="132" y="0" width="110" height="30" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="187" y="20" text-anchor="middle" class="pill-text">AWS EC2</text>

      <!-- Pill 3 -->
      <rect x="254" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="319" y="20" text-anchor="middle" class="pill-text">Proxmox VE</text>

      <!-- Pill 4 -->
      <rect x="396" y="0" width="120" height="30" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="456" y="20" text-anchor="middle" class="pill-text">CloudStack</text>
    </g>
  </g>
</svg>
